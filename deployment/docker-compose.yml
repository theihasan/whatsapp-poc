# Local, production-like stack. Usage (from the repository root):
#   cp deployment/docker.env.example deployment/docker.env   # then fill in secrets
#   docker compose -f deployment/docker-compose.yml --env-file deployment/docker.env up -d --build
#   docker compose -f deployment/docker-compose.yml exec app php artisan migrate --force
# Only nginx (HTTP + WebSockets) is published. MySQL, Redis and the gateway stay internal.
name: whatsapp-workspace

x-app: &app
    build:
        context: ..
        dockerfile: deployment/docker/app.Dockerfile
        args:
            VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
            VITE_REVERB_HOST: ${PUBLIC_HOST:-localhost}
            VITE_REVERB_PORT: ${HTTP_PORT:-8000}
            VITE_REVERB_SCHEME: http
    env_file: docker.env
    environment:
        DB_HOST: mysql
        REDIS_HOST: redis
        GATEWAY_URL: http://gateway:3100
        REVERB_SERVER_HOST: 0.0.0.0
        REVERB_SERVER_PORT: 8080
        # Server-side publishing goes straight to the Reverb container…
        REVERB_HOST: reverb
        REVERB_PORT: 8080
        REVERB_SCHEME: http
        # …while browsers connect through nginx.
        SECURITY_WS_ORIGIN: ws://${PUBLIC_HOST:-localhost}:${HTTP_PORT:-8000}
    depends_on:
        mysql: { condition: service_healthy }
        redis: { condition: service_healthy }
    volumes:
        - app-storage:/var/www/html/storage/app
        # Seeded from the image on first start; `docker compose down` + remove the volume after rebuilding assets.
        - app-public:/var/www/html/public
    restart: unless-stopped

services:
    app:
        <<: *app

    horizon:
        <<: *app
        command: php artisan horizon
        stop_signal: SIGTERM
        stop_grace_period: 60s

    reverb:
        <<: *app
        command: php artisan reverb:start --host=0.0.0.0 --port=8080

    scheduler:
        <<: *app
        command: php artisan schedule:work

    gateway:
        build:
            context: ..
            dockerfile: deployment/docker/gateway.Dockerfile
        env_file: gateway.env
        environment:
            GATEWAY_WEBHOOK_URL: http://nginx/api/gateway/events
        volumes:
            - gateway-data:/data
        stop_grace_period: 20s
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${HTTP_PORT:-8000}:80'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - app-public:/var/www/html/public:ro
        depends_on: [app, reverb]
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-whatsapp_workspace}
            MYSQL_USER: ${DB_USERNAME:-workspace}
            MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 5s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7.4-alpine
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 20
        restart: unless-stopped

volumes:
    mysql-data:
    redis-data:
    gateway-data:
    app-storage:
    app-public:
