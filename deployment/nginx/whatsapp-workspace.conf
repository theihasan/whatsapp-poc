# /etc/nginx/sites-available/whatsapp-workspace  (Ubuntu 24.04, PHP 8.4-FPM)
# TLS certificates via certbot: certbot --nginx -d workspace.example.com

server {
    listen 80;
    listen [::]:80;
    server_name workspace.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name workspace.example.com;
    root /var/www/whatsapp-workspace/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/workspace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 24m;
    access_log /var/log/nginx/whatsapp-workspace.access.log;
    error_log  /var/log/nginx/whatsapp-workspace.error.log;

    # Reverb WebSockets: public wss://workspace.example.com/app → private 127.0.0.1:8080
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Horizon dashboard stays behind Laravel auth (Gate viewHorizon).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
# The gateway (127.0.0.1:3100) is intentionally NOT proxied.
