; /etc/supervisor/conf.d/whatsapp-workspace.conf
; Runs as the unprivileged "deploy" user; paths assume /var/www/whatsapp-workspace/current.

[program:ww-horizon]
command=/usr/bin/php /var/www/whatsapp-workspace/current/artisan horizon
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/log/whatsapp-workspace/horizon.log

[program:ww-reverb]
command=/usr/bin/php /var/www/whatsapp-workspace/current/artisan reverb:start --host=127.0.0.1 --port=8080
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
minfds=10000
redirect_stderr=true
stdout_logfile=/var/log/whatsapp-workspace/reverb.log

[program:ww-gateway]
; Loads services/whatsapp-gateway/.env (mode 0600, owned by deploy). Binds 127.0.0.1 only.
directory=/var/www/whatsapp-workspace/shared/gateway
command=/usr/bin/node --env-file=/var/www/whatsapp-workspace/shared/gateway/.env --disable-warning=ExperimentalWarning /var/www/whatsapp-workspace/current/services/whatsapp-gateway/dist/index.js
user=deploy
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/whatsapp-workspace/gateway.log

[group:whatsapp-workspace]
programs=ww-horizon,ww-reverb,ww-gateway
